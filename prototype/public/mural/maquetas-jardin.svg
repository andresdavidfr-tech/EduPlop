  <rect x="206" y="190" width="6" height="16" fill="#9c6b43"/>
  <circle cx="209" cy="187" r="10" fill="#5cb85c"/>
  <!-- niño 1 -->
  <rect x="118" y="150" width="44" height="58" rx="20" fill="#ff8a4c"/>
  <circle cx="140" cy="140" r="19" fill="#f6c8a0"/>
  <path d="M121 141 a19 19 0 0 1 38 0 Z" fill="#5b3b2e"/>
  <!-- niño 2 -->
  <rect x="184" y="150" width="44" height="58" rx="20" fill="#3ab7ad"/>
  <circle cx="206" cy="140" r="19" fill="#eab089"/>
  <path d="M187 141 a19 19 0 0 1 38 0 Z" fill="#2b2b2b"/>
  <!-- flores -->
  <circle cx="28" cy="258" r="5" fill="#ff5d8f"/>
  <circle cx="92" cy="278" r="5" fill="#ffd34d"/>
  <circle cx="286" cy="262" r="5" fill="#ff5d8f"/>
  <circle cx="250" cy="288" r="5" fill="#ffffff"/>
