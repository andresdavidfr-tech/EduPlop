  <path d="M0 214 Q160 190 320 214 V320 H0 Z" fill="#9ed98a"/>
  <path d="M0 244 Q160 224 320 244 V320 H0 Z" fill="#84cf6f" opacity="0.55"/>
  <!-- árbol -->
  <rect x="40" y="120" width="14" height="98" rx="6" fill="#9c6b43"/>
  <circle cx="47" cy="108" r="33" fill="#5cb85c"/>
  <circle cx="26" cy="124" r="21" fill="#6cc46c"/>
  <circle cx="70" cy="124" r="21" fill="#6cc46c"/>
  <!-- mesa -->
  <rect x="104" y="206" width="136" height="14" rx="5" fill="#caa06b"/>
  <rect x="116" y="220" width="10" height="42" fill="#b98b56"/>
  <rect x="218" y="220" width="10" height="42" fill="#b98b56"/>
  <!-- maqueta: casita -->
  <rect x="150" y="176" width="44" height="30" fill="#fff7ec" stroke="#caa06b" stroke-width="2"/>
  <path d="M145 176 L172 154 L199 176 Z" fill="#e85d4e"/>
  <rect x="166" y="190" width="12" height="16" rx="1" fill="#caa06b"/>
