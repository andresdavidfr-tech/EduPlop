<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Proyecto de animales con maquetas">
  <rect width="320" height="320" fill="#fbf3e7"/>
  <!-- pared / cartelera -->
  <rect x="28" y="36" width="150" height="92" rx="8" fill="#ffffff" stroke="#e6d8c2" stroke-width="3"/>
  <circle cx="70" cy="74" r="16" fill="#ffd34d"/>
  <path d="M120 96 l16 -22 16 22 Z" fill="#9ed98a"/>
  <rect x="104" y="60" width="20" height="14" rx="3" fill="#8ab6ff"/>
  <!-- piso -->
  <rect x="0" y="232" width="320" height="88" fill="#efe2cc"/>
  <!-- mesa -->
  <rect x="92" y="224" width="160" height="14" rx="5" fill="#caa06b"/>
  <rect x="104" y="238" width="10" height="40" fill="#b98b56"/>
  <rect x="230" y="238" width="10" height="40" fill="#b98b56"/>
  <!-- maqueta elefante -->
  <g fill="#9aa6b2">
    <ellipse cx="138" cy="206" rx="22" ry="15"/>
    <circle cx="118" cy="200" r="12"/>
    <rect x="108" y="200" width="6" height="16" rx="3"/>
  </g>
  <!-- maqueta león -->
  <g>
    <circle cx="208" cy="202" r="15" fill="#f4a93b"/>
    <circle cx="208" cy="202" r="20" fill="none" stroke="#e07b2e" stroke-width="4"/>
    <circle cx="203" cy="200" r="2" fill="#3a2a17"/><circle cx="213" cy="200" r="2" fill="#3a2a17"/>
  </g>
  <!-- niño 1 -->
  <rect x="118" y="168" width="44" height="58" rx="20" fill="#7c5cff"/>
  <circle cx="140" cy="158" r="19" fill="#f6c8a0"/>
  <path d="M121 159 a19 19 0 0 1 38 0 Z" fill="#3a2a17"/>
  <!-- niño 2 -->
  <rect x="184" y="168" width="44" height="58" rx="20" fill="#ff8a4c"/>
  <circle cx="206" cy="158" r="19" fill="#eab089"/>
  <path d="M187 159 a19 19 0 0 1 38 0 Z" fill="#5b3b2e"/>
